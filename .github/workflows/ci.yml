name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Pi provides these optional peers at runtime. Installing the current CLI
      # globally lets the prepare script link the same declarations in CI.
      - name: Install Pi type provider
        run: npm install --global @earendil-works/pi-coding-agent@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run
